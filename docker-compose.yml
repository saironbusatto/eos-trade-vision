version: '3.8'

services:
  # ===========================================
  # Website - Nginx servindo frontend estático
  # ===========================================
  website:
    image: nginx:alpine
    container_name: eos-website
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    mem_limit: 64m
  # Gateway Server (Dashboard Backend) - Crypto Only
  # ===========================================
  gateway-server:
    build:
      context: ./eos-gateway
      dockerfile: Dockerfile
    container_name: eos-gateway
    env_file:
      - ./eos-telegram-bot/.env
    volumes:
      # Apenas Crypto Data
      - ./eos-telegram-bot/data:/app/data-crypto
    environment:
      - NODE_ENV=production
    restart: always
    mem_limit: 128m
    networks:
      - eos-network
    labels:
      - "com.eos.service=gateway"

  # ===========================================
  # Crypto Bot (eos-telegram-bot)
  # ===========================================
  eos-telegram-bot:
    build:
      context: ./eos-telegram-bot
      dockerfile: Dockerfile
    container_name: eos-crypto-bot
    env_file:
      - ./eos-telegram-bot/.env
    volumes:
      - ./eos-telegram-bot/data:/app/data
    restart: always
    mem_limit: 1024m # Aumentado para ML (até 1GB)
    networks:
      - eos-network
    labels:
      - "com.eos.service=telegram-bot"

  # ===========================================
  # Frontend Dashboard (Nginx)
  # ===========================================
  frontend:
    image: nginx:alpine
    container_name: eos-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./eos-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    networks:
      - eos-network

# ===========================================
# Rede compartilhada
# ===========================================
networks:
  eos-network:
    driver: bridge
    name: eos-network

# ===========================================
# Volumes persistentes
# ===========================================
volumes:
  ibgateway-data:
    name: eos-ibgateway-data
