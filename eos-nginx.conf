server {
    server_name eos.s-iron.tech;

    root /var/www/eos;
    index index.html;

    # Proxy for Gateway API - accessible via HTTPS at /api/gateway/
    location /api/gateway/ {
        proxy_pass http://127.0.0.1:3001/api/gateway/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # VNC (Removido: Servidor Forex/IB Desativado)
    # location /vnc/ { ... }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/eos.s-iron.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eos.s-iron.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = eos.s-iron.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name eos.s-iron.tech;
    return 404; # managed by Certbot
}
