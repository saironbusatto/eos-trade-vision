name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'eos-telegram-bot/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ec2-user/eos-bot
            git pull origin main 2>/dev/null || true
            cd /home/ec2-user/eos-bot
            npm install
            pm2 restart eos-bot
