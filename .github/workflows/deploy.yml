name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'eos-telegram-bot/**'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu

            if [ -d /home/ec2-user/eos-telegram-bot ]; then
              APP_DIR=/home/ec2-user/eos-telegram-bot
            else
              APP_DIR=/home/ec2-user/eos-bot
            fi

            cd "$APP_DIR"
            git pull origin main 2>/dev/null || true

            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi

            pm2 restart eos-bot --update-env || pm2 start dist/index.js --name eos-bot

            if [ -f scripts/deploy_post_cleanup.sh ]; then
              sh scripts/deploy_post_cleanup.sh "$APP_DIR"
            else
              echo "[deploy] scripts/deploy_post_cleanup.sh not found; skipping cleanup"
            fi
