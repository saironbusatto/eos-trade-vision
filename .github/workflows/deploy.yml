name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'eos-telegram-bot/**'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu

            REPO_DIR=/home/ec2-user/eos-telegram-bot
            LEGACY_DIR=/home/ec2-user/eos-bot
            BOT_DIR="$REPO_DIR/eos-telegram-bot"

            if [ ! -d "$REPO_DIR" ]; then
              REPO_DIR="$LEGACY_DIR"
              BOT_DIR="$REPO_DIR"
            fi

            cd "$REPO_DIR"

            if [ -d .git ]; then
              git pull --rebase --autostash origin main || {
                git stash push --include-untracked --message "deploy-autostash-$(date +%Y%m%d%H%M%S)" || true
                git pull origin main
              }
            fi

            if [ ! -d "$BOT_DIR" ]; then
              BOT_DIR="$REPO_DIR"
            fi

            if [ -f "$BOT_DIR/package-lock.json" ]; then
              (cd "$BOT_DIR" && npm ci --omit=dev)
            else
              (cd "$BOT_DIR" && npm install --omit=dev)
            fi

            if [ -f "$LEGACY_DIR/.env" ] && [ ! -f "$REPO_DIR/.env" ]; then
              cp "$LEGACY_DIR/.env" "$REPO_DIR/.env"
              chmod 600 "$REPO_DIR/.env" || true
            fi

            pm2 delete eos-bot >/dev/null 2>&1 || true
            pm2 start "$BOT_DIR/dist/index.js" --name eos-bot --cwd "$BOT_DIR" --update-env
            pm2 save

            if [ -f "$REPO_DIR/scripts/deploy_post_cleanup.sh" ]; then
              sh "$REPO_DIR/scripts/deploy_post_cleanup.sh" "$REPO_DIR"
            else
              echo "[deploy] scripts/deploy_post_cleanup.sh not found; skipping cleanup"
            fi
